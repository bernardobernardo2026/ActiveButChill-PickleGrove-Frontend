<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipment Rental - The Pickle Grove</title>
<link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

<div class="admin-layout">
    <div class="sidebar">
        <div class="logo">
            <img src="pickle logo.jpg" alt="Logo">
            <h2 style="font-size:16px;">The Pickle Grove</h2>
        </div>
        <button class="sidebar-btn" onclick="window.location.href='admin-dashboard.html'">Dashboard</button>
        <button class="sidebar-btn" onclick="window.location.href='admin-calendar.html'">Calendar</button>
        <button class="sidebar-btn" onclick="window.location.href='admin-bookings.html'">Bookings</button>
        <button class="sidebar-btn active" onclick="window.location.href='equipment.html'">Equipment Rental</button>
        <button class="sidebar-logout">Logout</button>
    </div>

    <div class="content-area">
        <div class="content-topbar">
            <h2>Equipment Rental</h2>
            <div class="topbar-icons">
            <span class="topbar-icon" onclick="toggleNotifications()">&#128276;</span>
            <span class="topbar-icon" onclick="window.location.href='profile.html'">&#128100;</span>
            <span class="topbar-icon" onclick="window.location.href='settings.html'">&#9881;</span>
            <div class="notification-panel" id="notificationPanel">
                <div class="notification-header">
                    <h4>Notifications</h4>
                    <a onclick="markAllRead()">Mark all as read</a>
                </div>
                <div class="notification-item">
                    <div class="notif-icon mint">&#128230;</div>
                    <div class="notif-body">
                        <div class="notif-title">Equipment rental added</div>
                        <div class="notif-desc">5 new Pro Graphite Paddles added.</div>
                        <div class="notif-desc">August 10, 2026</div>
                    </div>
                    <div class="notif-time">1 hour ago</div>
                </div>
            </div>
            </div>
        </div>
        <h2>Equipment Rental</h2>
        <p class="subtitle">View and monitor equipment rentals.</p>

        <div style="display:flex; gap:15px; margin-bottom:20px;">
            <input type="text" id="equipmentSearchInput" placeholder="Search..." oninput="renderEquipmentTable()" style="flex:2; padding:10px; border:1px solid #ccc; border-radius:6px;">
            <input type="text" placeholder="Date" style="flex:1; padding:10px; border:1px solid #ccc; border-radius:6px;">
            <button class="btn-primary" style="max-width:150px;">+ New Rental</button>
        </div>

        <h4>Equipment Rental Records</h4>
        <div style="display:flex; gap:10px; margin-bottom:10px;">
            <button class="btn-secondary" id="equipmentFilterAll" onclick="setEquipmentFilter('all', this)" style="max-width:80px;">All</button>
            <button id="equipmentFilterUpcoming" onclick="setEquipmentFilter('upcoming', this)" style="max-width:100px; background:white; border:1px solid #ccc; border-radius:6px; padding:8px 14px; cursor:pointer;">Upcoming</button>
        </div>

        <table class="schedule-table" style="text-align:left;">
            <thead>
                <tr><th>Name</th><th>Date</th><th>Equipment</th><th>Quantity</th><th>Status</th></tr>
            </thead>
            <tbody id="equipmentTableBody">
                <tr><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="../JavaScript/script.js"></script>
</body>
</html>
