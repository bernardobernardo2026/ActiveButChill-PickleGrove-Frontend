<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - The Pickle Grove</title>
<link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

<div class="admin-layout">
    <div class="sidebar">
        <div class="logo">
            <img src="pickle logo.jpg" alt="Logo">
            <h2 style="font-size:16px;">The Pickle Grove</h2>
        </div>
        <button class="sidebar-btn" onclick="window.location.href='admin-dashboard.html'">Dashboard</button>
        <button class="sidebar-btn" onclick="window.location.href='admin-calendar.html'">Calendar</button>
        <button class="sidebar-btn" onclick="window.location.href='admin-bookings.html'">Bookings</button>
        <button class="sidebar-btn" onclick="window.location.href='equipment.html'">Equipment Rental</button>
        <button class="sidebar-logout">Logout</button>
    </div>

    <div class="content-area">
        <div class="content-topbar">
            <h2>Profile</h2>
            <div class="topbar-icons">
            <span class="topbar-icon" onclick="toggleNotifications()">&#128276;</span>
            <span class="topbar-icon" onclick="window.location.href='profile.html'">&#128100;</span>
            <span class="topbar-icon" onclick="window.location.href='settings.html'">&#9881;</span>
            <div class="notification-panel" id="notificationPanel">
                <div class="notification-header">
                    <h4>Notifications</h4>
                    <a onclick="markAllRead()">Mark all as read</a>
                </div>
                <div class="notification-item">
                    <div class="notif-icon blue">&#10003;</div>
                    <div class="notif-body">
                        <div class="notif-title">Booking confirmation</div>
                        <div class="notif-desc">Booking for Court 2 has been confirmed</div>
                        <div class="notif-desc">August 13, 2026</div>
                    </div>
                    <div class="notif-time">15 mins ago</div>
                </div>
            </div>
            </div>
        </div>
        <h2>Profile</h2>
        <p class="subtitle">Manage your account information</p>

        <div class="form-card">
            <div style="display:flex; align-items:center; gap:20px; margin-bottom:25px;">
                <div style="width:80px; height:80px; border:1px solid #ccc; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#999; font-size:28px;">&#128444;</div>
                <button class="btn-secondary" style="max-width:150px;">Change Photo</button>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Full Name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Email Address">
            </div>
            <div class="form-group">
                <label>Contact Number</label>
                <input type="text" placeholder="Contact Number">
            </div>
            <div class="form-group">
                <label>Account Status</label>
                <input type="text" placeholder="Account Status" readonly>
            </div>

            <div class="form-actions">
                <button class="btn-secondary" style="max-width:120px;">Cancel</button>
                <button class="btn-primary" style="max-width:150px;" onclick="openModal('savedModal')">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="savedModal">
    <div class="modal-box">
        <div class="modal-icon success">&#10003;</div>
        <h3>Success</h3>
        <p>Changes saved successfully!</p>
        <div class="modal-actions">
            <button class="btn-primary" onclick="closeModal('savedModal')">Done</button>
        </div>
    </div>
</div>


<script src="../JavaScript/script.js"></script>
</body>
</html>
